# Nur der Agent-Socket des Hosts wandert in den Container — keine Keys, nicht die
# ~/.ssh des Hosts. Die ~/.ssh des Containers liegt im Volume devdock-home.
services:
  dev:
    environment:
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    volumes:
      - ${DEVDOCK_SSH_AUTH_SOCK}:/run/host-services/ssh-auth.sock
