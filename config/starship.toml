"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000

# Das container-Modul kennt bei Docker keinen Namen und zeigt nur "Docker".
# Stattdessen den Workspace-Namen, den ./devdock als DEVDOCK_NAME mitgibt, an
# derselben Stelle vor dem Prompt-Zeichen.
format = '$all${env_var.DEVDOCK_NAME}$character'

# Replace the '❯' symbol in the prompt
[character]
success_symbol = '⚓'
error_symbol = '💥'

[container]
disabled = true

[env_var.DEVDOCK_NAME]
symbol = '🐳 '
format = '[$symbol{$env_value}]($style) '
style = 'bold bright-blue'

[directory]
format = '💾 [$path]($style)[$read_only]($read_only_style) '

[dotnet]
disabled = true

[git_branch]
symbol = '🌱 '
ignore_branches = ['master', 'main']

[git_state]
format = '\($state( $progress_current of $progress_total)\)($style) '
cherry_pick = '🍒 PICKING(bold red)'

# [git_status]
