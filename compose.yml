# Basis des Dev-Containers. Gestartet wird über ./devdock — das Script setzt die
# DEVDOCK_*-Variablen und hängt je nach Host die Overlays an:
#   compose.ssh.yml         SSH-Agent des Hosts
#   compose.wayland.yml     Wayland-Display des Hosts
#   compose.gpu.yml         /dev/dri für hardwarebeschleunigtes Rendering
#   compose.tmux.yml        tmux-Config des Hosts
#   compose.gitconfig.yml   ./gitconfig (rw) oder gefilterte Host-Git-Config (ro)
#   compose.git-ignore.yml  globale Git-ignore-Liste des Hosts
#   compose.tailscale.yml   eigenes Netz mit Tailscale-Sidecar statt Host-Netz
#   compose.tailscale-state.yml  dauerhafte Tailnet-Identität (sonst ephemeral)

services:
  dev:
    image: devdock:latest
    build:
      context: .
      args:
        USERNAME: ${DEVDOCK_USER:?bitte über ./devdock starten}
        USER_UID: ${DEVDOCK_UID:?bitte über ./devdock starten}
        USER_GID: ${DEVDOCK_GID:?bitte über ./devdock starten}
        # Leer heißt nvim-config-next (Default im Dockerfile)
        NEOVIM_CONFIG: ${DEVDOCK_NEOVIM_CONFIG:-}
    init: true
    # Zeit für devdock-entrypoint, die OpenKnowledge-Server sauber anzuhalten
    stop_grace_period: 30s
    # Host-Netz: Dev-Server im Container sind auf dem Host unter localhost erreichbar
    # und umgekehrt; kein Port-Mapping nötig. compose.tailscale.yml ersetzt es
    # durch den Namespace des Tailscale-Sidecars.
    network_mode: host
    shm_size: 2gb
    group_add:
      - "${DEVDOCK_DOCKER_GID}"
    # Lokale, gitignorte Variablen (Vorlage: .env.example); ./devdock wählt die
    # Datei: $DEVDOCK_ENV, sonst .env in $DEVDOCK_CONFIG bzw. im devdock-Repo
    env_file:
      - path: ${DEVDOCK_ENV_FILE:?bitte über ./devdock starten}
        required: false
    environment:
      DEVDOCK: "1"
      # Workspace-Name für den Starship-Prompt
      DEVDOCK_NAME: ${DEVDOCK_NAME}
      # Workspace-Wurzel, dort liegt .devdock/ok-autostart (ok activate)
      DEVDOCK_WORKSPACE: ${DEVDOCK_WORKSPACE}
      XDG_RUNTIME_DIR: /run/user/${DEVDOCK_UID}
      # Der Tailscale-Key aus .env ist für den Sidecar (compose.tailscale.yml),
      # nicht für jeden Prozess im Container; environment schlägt env_file.
      TS_AUTHKEY: ""
    # Workspace liegt im Container unter demselben Pfad wie auf dem Host. Nur so
    # stimmen Bind-Mounts, die man von drinnen an den Host-Daemon schickt.
    working_dir: ${DEVDOCK_WORKSPACE}
    volumes:
      - ${DEVDOCK_WORKSPACE}:${DEVDOCK_WORKSPACE}
      - ${DEVDOCK_DOCKER_SOCK}:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - cache:/home/${DEVDOCK_USER}/.cache
      # Das bleibende Home: ein Volume, je ein Unterverzeichnis pro Pfad. Was das
      # Image hier mitbringt (Neovim samt Plugins, …), liegt unter
      # /opt/devdock/skel und landet per devdock-entrypoint im Volume.
      - type: volume
        source: home
        target: /home/${DEVDOCK_USER}/.config
        volume:
          subpath: config
      - type: volume
        source: home
        target: /home/${DEVDOCK_USER}/.local
        volume:
          subpath: local
      - type: volume
        source: home
        target: /home/${DEVDOCK_USER}/.claude
        volume:
          subpath: claude
      # Optionale Tools (install-hermes, install-openknowledge, …), je eines pro
      # Unterverzeichnis; ~/.hermes, ~/.ok usw. sind im Image dorthin verlinkt
      - addons:/home/${DEVDOCK_USER}/.addons
      # Configs aus dem devdock-Repo, im Image nach ~/.config verlinkt
      - ./config:/opt/devdock/config:ro

# Feste Namen: alle Workspaces teilen sich Caches (pnpm-Store, Go-Build-Cache,
# Playwright-Browser), das Home (~/.config samt gh-Login, ~/.local samt
# Shell-History, ~/.claude) und die optional installierten Tools samt Daten.
# external, weil jeder Workspace ein eigenes Compose-Projekt ist und keines die
# Volumes besitzen soll; ./devdock legt sie an, bei devdock-home samt den
# Unterverzeichnissen, ohne die Docker einen subpath-Mount verweigert.
volumes:
  cache:
    name: devdock-cache
    external: true
  home:
    name: devdock-home
    external: true
  addons:
    name: devdock-addons
    external: true
